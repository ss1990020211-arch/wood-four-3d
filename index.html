<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WOOD FOUR 3D</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#403027,#110f10 75%);color:#f5e5c6;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;text-align:center}header{padding:20px 12px 3px}h1{font-family:Georgia,serif;letter-spacing:3px;font-size:28px;margin:0;color:#e9c58b}small{color:#c6a77c;letter-spacing:3px}.status{margin:12px auto 4px;padding:10px 16px;border:1px solid #886d4a;border-radius:28px;display:inline-block;background:#241c19;font-size:15px}canvas{width:100%;max-width:600px;display:block;margin:auto;touch-action:none}nav{display:flex;justify-content:center;gap:12px;padding:8px 12px 16px}button{border:1px solid #a78960;border-radius:12px;background:linear-gradient(#594333,#30241e);color:#fff0d3;padding:13px 20px;font-size:15px;min-height:46px}p{font-size:12px;color:#bfae9b;margin:4px 12px 14px}.gold{color:#f4d38e}</style></head><body><header><h1>WOOD FOUR 3D</h1><small>PREMIUM BOARD GAME</small></header><div class="status" id="status">● 濃茶の番です</div><canvas id="board" aria-label="立体四目並べの盤面。タップでコマを置き、横にドラッグして回転"></canvas><nav><button id="left">↶ 回転</button><button id="reset">新しい対局</button><button id="right">回転 ↷</button></nav><p>棒の位置をタップしてコマを置く ／ 横にスワイプして盤面を回転</p><script>
(()=>{'use strict';const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const N=4;let cells=Array.from({length:4},()=>Array.from({length:4},()=>[])),turn=1,over=false,winning=[],angle=-Math.PI/4,targets=[],down=null;const wood=['','#593024','#e8bd7c'];let w=360,h=480,scale=1;function resize(){w=Math.min(innerWidth,600);h=Math.round(w*1.22);scale=w/360;canvas.width=Math.round(w*devicePixelRatio);canvas.height=Math.round(h*devicePixelRatio);canvas.style.height=h+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}function project(x,y,z){let xx=x-1.5,yy=y-1.5;let a=xx*Math.cos(angle)-yy*Math.sin(angle),b=xx*Math.sin(angle)+yy*Math.cos(angle);return {x:w/2+a*48*scale,y:h*.66+b*21*scale-z*46*scale}}function ball(x,y,z,color,r){let p=project(x,y,z),rad=r*scale;let g=ctx.createRadialGradient(p.x-rad*.3,p.y-rad*.4,rad*.08,p.x,p.y,rad);if(color===1){g.addColorStop(0,'#a66d4c');g.addColorStop(.55,'#67392a');g.addColorStop(1,'#24120e')}else{g.addColorStop(0,'#fff0c9');g.addColorStop(.6,'#d8ac6c');g.addColorStop(1,'#89613b')}ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,235,190,.35)';ctx.lineWidth=1*scale;ctx.stroke();if(winning.some(v=>v[0]===x&&v[1]===y&&v[2]===z)){ctx.beginPath();ctx.arc(p.x,p.y,rad+4*scale,0,Math.PI*2);ctx.strokeStyle='#ffda72';ctx.lineWidth=3*scale;ctx.stroke()}}function draw(){ctx.clearRect(0,0,w,h);targets=[];let center=project(1.5,1.5,0);ctx.save();ctx.translate(center.x,center.y+16*scale);ctx.rotate(angle);ctx.fillStyle='#a27649';ctx.fillRect(-113*scale,-113*scale,226*scale,226*scale);ctx.strokeStyle='#f0c992';ctx.lineWidth=5*scale;ctx.strokeRect(-113*scale,-113*scale,226*scale,226*scale);ctx.restore();let items=[];for(let x=0;x<4;x++)for(let y=0;y<4;y++){let base=project(x,y,0),top=project(x,y,4);items.push({x,y,depth:(x-1.5)*Math.sin(angle)+(y-1.5)*Math.cos(angle),base,top});}items.sort((a,b)=>a.depth-b.depth);for(let item of items){let {x,y,base,top}=item;ctx.strokeStyle='#a77b50';ctx.lineWidth=8*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(base.x,base.y+9*scale);ctx.lineTo(top.x,top.y);ctx.stroke();ctx.strokeStyle='#e4ba81';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(base.x-2*scale,base.y+7*scale);ctx.lineTo(top.x-2*scale,top.y);ctx.stroke();for(let z=0;z<cells[x][y].length;z++)ball(x,y,z+.46,cells[x][y][z],19);if(!over&&cells[x][y].length<4){let p=project(x,y,cells[x][y].length+.46);targets.push({x,y,px:p.x,py:p.y,depth:item.depth});ctx.beginPath();ctx.arc(top.x,top.y,8*scale,0,Math.PI*2);ctx.fillStyle='rgba(245,212,145,.85)';ctx.fill()}}}function winner(){const dirs=[];for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){if(!dx&&!dy&&!dz)continue;if(dx<0||(dx===0&&dy<0)||(dx===0&&dy===0&&dz<0))continue;dirs.push([dx,dy,dz])}for(let x=0;x<4;x++)for(let y=0;y<4;y++)for(let z=0;z<4;z++){let c=cells[x][y][z];if(!c)continue;for(let [dx,dy,dz]of dirs){let line=[];for(let k=0;k<4;k++){let a=x+k*dx,b=y+k*dy,d=z+k*dz;if(a<0||a>3||b<0||b>3||d<0||d>3||cells[a][b][d]!==c)break;line.push([a,b,d])}if(line.length===4)return line}}return null}function place(x,y){if(over||cells[x][y].length===4)return;cells[x][y].push(turn);let win=winner();if(win){winning=win;over=true;status.innerHTML='<span class="gold">✦ '+(turn===1?'濃茶':'淡木')+'の勝利！ ✦</span>'}else if(cells.every(row=>row.every(col=>col.length===4))){over=true;status.textContent='引き分けです'}else{turn=3-turn;status.textContent='● '+(turn===1?'濃茶':'淡木')+'の番です'}draw()}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{down={...pos(e),angle};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;let p=pos(e);if(Math.abs(p.x-down.x)>8*scale){angle=down.angle+(p.x-down.x)*.009;draw()}});canvas.addEventListener('pointerup',e=>{if(!down)return;let p=pos(e),dist=Math.hypot(p.x-down.x,p.y-down.y);if(dist<14*scale){let possible=targets.map(t=>({...t,d:Math.hypot(p.x-t.px,p.y-t.py)})).sort((a,b)=>a.d-b.d);if(possible[0]&&possible[0].d<42*scale)place(possible[0].x,possible[0].y)}down=null});canvas.addEventListener('pointercancel',()=>down=null);document.getElementById('left').onclick=()=>{angle-=Math.PI/4;draw()};document.getElementById('right').onclick=()=>{angle+=Math.PI/4;draw()};document.getElementById('reset').onclick=()=>{cells=Array.from({length:4},()=>Array.from({length:4},()=>[]));turn=1;over=false;winning=[];status.textContent='● 濃茶の番です';draw()};addEventListener('resize',resize);resize()})();
</script></body></html>
